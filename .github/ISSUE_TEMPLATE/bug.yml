name: Bug report
description: Report a reproducible public issue.
body:
  - type: input
    id: revision
    attributes:
      label: Commit or release and platform
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and observed result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or Actions links
