name: Correct Modrinth alpha.1 environment
on:
  push:
    branches: [modrinth-alpha1-metadata]
permissions: {}
jobs:
  correct-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Set existing version to Client only
        env:
          MODRINTH_TOKEN: ${{ secrets.modrinth_pat }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          url = "https://api.modrinth.com/v3/version/ex13ep3x"
          headers = {
              "Authorization": os.environ["MODRINTH_TOKEN"],
              "Content-Type": "application/json",
              "User-Agent": "TrissTheBoss/NeoSunset (release metadata repair)",
          }
          def request(method, data=None):
              try:
                  with urlopen(Request(url, data=data, headers=headers, method=method), timeout=20) as response:
                      return response.read()
              except HTTPError as error:
                  raise SystemExit(f"Modrinth {method} returned HTTP {error.code}") from None
          request("PATCH", b'{"environment":"client_only"}')
          print("Modrinth accepted the metadata update.")
          result = json.loads(request("GET"))
          assert result.get("environment") == "client_only", "Modrinth did not return Client only"
          print("Verified alpha.1 environment: client_only")
          PY
