name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  handbook:
    name: Handbook
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.stage.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate handbook
        run: python3 .github/scripts/check_handbook.py
      - name: Detect the Cargo workspace
        id: stage
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            git ls-files --error-unmatch -- Cargo.lock >/dev/null && test -f Cargo.lock
            echo 'workspace=true' >> "$GITHUB_OUTPUT"
          else
            if git ls-files --error-unmatch -- '**/Cargo.toml' 'Cargo.lock' >/dev/null 2>&1; then
              echo 'Commit the root Cargo workspace and lockfile together.' >&2
              exit 1
            fi
            echo 'workspace=false' >> "$GITHUB_OUTPUT"
            echo 'Handbook stage. No Rust workspace exists.' >> "$GITHUB_STEP_SUMMARY"
          fi

  platform:
    name: ${{ matrix.platform }}
    needs: handbook
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows AMD64
            runner: windows-2025
            arch: X64
            target: x86_64-pc-windows-msvc
            binary: neosunset.exe
          - platform: Windows ARM64
            runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
            binary: neosunset.exe
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: ARM64
            target: aarch64-unknown-linux-gnu
            binary: neosunset
          - platform: macOS Apple Silicon
            runner: macos-15
            arch: ARM64
            target: aarch64-apple-darwin
            binary: neosunset
          - platform: macOS Intel
            runner: macos-15-intel
            arch: X64
            target: x86_64-apple-darwin
            binary: neosunset
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      RUST_TARGET: ${{ matrix.target }}
      BINARY_NAME: ${{ matrix.binary }}
    steps:
      - name: Verify native runner
        env:
          WORKSPACE_PRESENT: ${{ needs.handbook.outputs.workspace }}
        run: |
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_ARCH) {
            throw "Expected $env:EXPECTED_ARCH, got $env:RUNNER_ARCH"
          }
          if ($env:WORKSPACE_PRESENT -eq 'false') {
            'Native runner verified. Rust compilation begins when the workspace lands.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.handbook.outputs.workspace == 'true'
        with:
          persist-credentials: false
      - name: Verify pinned Rust toolchain and host
        if: needs.handbook.outputs.workspace == 'true'
        run: |
          $version = rustc -vV
          if ($LASTEXITCODE -ne 0) { throw 'Unable to run the pinned Rust compiler' }
          $version
          if ($version -notcontains "host: $env:RUST_TARGET") {
            throw "Expected a native Rust toolchain for $env:RUST_TARGET"
          }
      - name: Format
        if: needs.handbook.outputs.workspace == 'true'
        run: cargo fmt --all -- --check
      - name: Lint
        if: needs.handbook.outputs.workspace == 'true'
        run: cargo clippy --locked --workspace --all-targets --target $env:RUST_TARGET -- -D warnings
      - name: Test
        if: needs.handbook.outputs.workspace == 'true'
        run: cargo test --locked --workspace --target $env:RUST_TARGET
      - name: Document
        if: needs.handbook.outputs.workspace == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --target $env:RUST_TARGET
      - name: Build release profile
        if: needs.handbook.outputs.workspace == 'true'
        run: cargo build --locked --release --workspace --target $env:RUST_TARGET
      - name: Package executable with license and checksum
        if: needs.handbook.outputs.workspace == 'true'
        run: |
          New-Item -ItemType Directory -Path dist/payload -Force | Out-Null
          Copy-Item "target/$env:RUST_TARGET/release/$env:BINARY_NAME" dist/payload/
          Copy-Item -Path LICENSE, README.md -Destination dist/payload/
          $archive = "neosunset-$env:RUST_TARGET.tar.gz"
          tar -czf "dist/$archive" -C dist/payload .
          if ($LASTEXITCODE -ne 0) { throw 'Unable to package the executable' }
          $sha256 = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $archive" | Set-Content -Path "dist/$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: needs.handbook.outputs.workspace == 'true'
        with:
          name: neosunset-${{ matrix.target }}
          path: dist/neosunset-*
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required checks
    if: always()
    needs: [handbook, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HANDBOOK_RESULT: ${{ needs.handbook.result }}
      PLATFORM_RESULT: ${{ needs.platform.result }}
    steps:
      - name: Require successful handbook and platform jobs
        run: test "$HANDBOOK_RESULT" = success && test "$PLATFORM_RESULT" = success
