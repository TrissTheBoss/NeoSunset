name: Build and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Build and run policy tests
        run: gradle --no-daemon build
      - name: Verify version and packaged resources
        id: release
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: python3 .github/verify_jar.py
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: NeoSunset-jar
          path: build/libs/neosunset-*.jar
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified tag to Modrinth
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: modrinth-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: NeoSunset-jar
          path: release
      - name: Publish on Modrinth
        uses: cloudnode-pro/modrinth-publish@3870f66007063f03fb70118ca9eddbc09a4ba666 # v2.5.2
        with:
          token: ${{ secrets.modrinth_pat }}
          project: ${{ secrets.modrinth_id }}
          version: ${{ needs.build.outputs.version }}
          channel: ${{ needs.build.outputs.channel }}
          loaders: fabric
          game-versions: '26.3'
          files: release/neosunset-${{ needs.build.outputs.version }}.jar
          changelog: 'See the source and release notes at https://github.com/TrissTheBoss/NeoSunset/tree/${{ github.sha }}.'
