name: Build and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Build and run policy tests
        run: gradle --no-daemon build
      - name: Verify version and packaged resources
        id: release
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: python3 .github/verify_jar.py
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: NeoSunset-jar
          path: build/libs/neosunset-*.jar
          if-no-files-found: error
          retention-days: 14

  client:
    name: Fabric client smoke (Linux)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Build the instrumented test JAR
        run: gradle --no-daemon -PsmokeClient jar
      - name: Install the pinned demo-launch library
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --disable-pip-version-check minecraft-launcher-lib==8.0
      - name: Install software graphics drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers
      - name: Launch Minecraft 26.3 and verify the loaded hooks and option
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
          ALSOFT_DRIVERS: "null"
        shell: bash
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          timeout --kill-after=20s 10m xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' \
            .ci-venv/bin/python .github/smoke_loader.py fabric "$RUNNER_TEMP/smoke" \
            build/libs/neosunset-*.jar 2>&1 | tee smoke.log
          test "$(cat "$RUNNER_TEMP/smoke/neosunset-smoke-pass")" = PASS

  additional-loaders:
    name: Additional loader checks
    needs: build
    uses: ./.github/workflows/loader-smoke.yml

  publish:
    name: Publish verified version to Modrinth
    if: github.event_name == 'push' && needs.build.outputs.publish == 'true'
    needs: [build, client, additional-loaders]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: modrinth-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: NeoSunset-jar
          path: release
      - name: Publish on Modrinth
        id: modrinth
        uses: cloudnode-pro/modrinth-publish@3870f66007063f03fb70118ca9eddbc09a4ba666 # v2.5.2
        with:
          token: ${{ secrets.modrinth_pat }}
          project: ${{ secrets.modrinth_id }}
          version: ${{ needs.build.outputs.version }}
          channel: ${{ needs.build.outputs.channel }}
          loaders: |
            fabric
            quilt
            forge
            neoforge
          game-versions: '26.3'
          files: release/neosunset-${{ needs.build.outputs.version }}.jar
          changelog: 'Release notes and source: https://github.com/TrissTheBoss/NeoSunset/tree/${{ github.sha }}.'
      - name: Record the published version ID
        env:
          VERSION_ID: ${{ steps.modrinth.outputs.version-id }}
        run: printf 'Modrinth version ID %s\n' "$VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
