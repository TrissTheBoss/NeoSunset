name: Additional loader smoke tests

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  loader-smoke:
    name: ${{ matrix.loader }} client smoke (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        loader: [quilt, forge, neoforge]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: '9.6.0'
          cache-read-only: true
      - name: Build the instrumented test JAR
        run: gradle --no-daemon -PsmokeClient jar
      - name: Install the pinned demo-launch library
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --disable-pip-version-check minecraft-launcher-lib==8.0
      - name: Launch Minecraft 26.3 and check the option
        env:
          LOADER: ${{ matrix.loader }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_DRIVER: x11
        shell: bash
        run: |
          timeout --kill-after=20s 10m xvfb-run -a -s '-screen 0 1280x720x24' \
            .ci-venv/bin/python .github/smoke_loader.py "$LOADER" "$RUNNER_TEMP/smoke" \
            build/libs/neosunset-*.jar 2>&1 | tee smoke.log
          test "$(cat "$RUNNER_TEMP/smoke/neosunset-smoke-pass")" = PASS
